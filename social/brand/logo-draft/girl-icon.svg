  <!-- outer navy ring on top -->
  <circle cx="470" cy="560" r="412" fill="none" stroke="#141A33" stroke-width="28"/>
  <circle cx="470" cy="560" r="345" fill="none" stroke="#141A33" stroke-width="20"/>
</svg>
