<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="disc"><circle cx="470" cy="560" r="345"/></clipPath>
  </defs>
  <!-- sparkles (logo DNA) -->
  <g fill="#FFC533">
    <path d="M842 120 q10 52 58 62 q-48 10 -58 62 q-10 -52 -58 -62 q48 -10 58 -62z"/>
    <path d="M920 240 q12 64 72 76 q-60 12 -72 76 q-12 -64 -72 -76 q60 -12 72 -76z"/>
    <path d="M960 470 q7 36 40 43 q-33 7 -40 43 q-7 -36 -40 -43 q33 -7 40 -43z" transform="translate(-30 0)"/>
  </g>
  <!-- yellow ring + cream space -->
  <circle cx="470" cy="560" r="412" fill="#FFC533"/>
  <circle cx="470" cy="560" r="345" fill="#FFF4DC"/>
  <g clip-path="url(#disc)">
    <!-- soft planet glow -->
    <circle cx="470" cy="1040" r="420" fill="#FFE2A8"/>
