    <path d="M600 320 C 700 250, 810 300, 800 410 C 795 460, 760 490, 735 495 C 755 450, 745 405, 705 385 C 680 372, 650 372, 625 380 Z" fill="#B4532A" stroke="#141A33" stroke-width="20" stroke-linejoin="round"/>
