    <!-- ears / headset (mint, like the robot's ear) -->
    <circle cx="282" cy="545" r="52" fill="#5FE0A8" stroke="#141A33" stroke-width="20"/>
    <circle cx="658" cy="545" r="52" fill="#5FE0A8" stroke="#141A33" stroke-width="20"/>
    <!-- hair: top + bangs -->
    <path d="M272 520 C 250 360, 360 268, 480 270 C 610 272, 690 360, 668 520 C 640 450, 600 410, 560 395 C 545 430, 500 455, 450 452 C 470 430, 478 410, 476 392 C 430 430, 360 455, 300 470 C 290 485, 280 500, 272 520 Z" fill="#B4532A" stroke="#141A33" stroke-width="20" stroke-linejoin="round"/>
    <!-- hair tie -->
    <circle cx="618" cy="338" r="24" fill="#FF6F4A" stroke="#141A33" stroke-width="16"/>
    <!-- star clip (antenna replacement) -->
    <path d="M360 330 l14 30 32 4 -24 22 7 32 -29 -16 -29 16 7 -32 -24 -22 32 -4z" fill="#FFC533" stroke="#141A33" stroke-width="12" stroke-linejoin="round"/>
    <!-- eyes -->
    <circle cx="400" cy="545" r="50" fill="#FFFFFF" stroke="#141A33" stroke-width="16"/>
    <circle cx="545" cy="545" r="50" fill="#FFFFFF" stroke="#141A33" stroke-width="16"/>
    <circle cx="408" cy="552" r="30" fill="#2FBF8A"/>
    <circle cx="553" cy="552" r="30" fill="#2FBF8A"/>
    <circle cx="410" cy="555" r="15" fill="#141A33"/>
    <circle cx="555" cy="555" r="15" fill="#141A33"/>
    <circle cx="420" cy="540" r="9" fill="#FFFFFF"/>
    <circle cx="565" cy="540" r="9" fill="#FFFFFF"/>
    <!-- brows -->
    <path d="M355 478 q45 -26 90 -6" fill="none" stroke="#141A33" stroke-width="14" stroke-linecap="round"/>
    <path d="M500 472 q45 -20 90 6" fill="none" stroke="#141A33" stroke-width="14" stroke-linecap="round"/>
    <!-- cheeks + freckles -->
    <ellipse cx="360" cy="625" rx="36" ry="20" fill="#FF9C86" opacity=".7"/>
    <ellipse cx="585" cy="625" rx="36" ry="20" fill="#FF9C86" opacity=".7"/>
    <g fill="#C9734B"><circle cx="452" cy="605" r="5"/><circle cx="470" cy="613" r="5"/><circle cx="488" cy="605" r="5"/></g>
    <!-- smile -->
    <path d="M425 650 q48 40 96 0" fill="none" stroke="#141A33" stroke-width="16" stroke-linecap="round"/>
