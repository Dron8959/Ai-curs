    <rect x="360" y="850" width="220" height="140" rx="22" fill="#5FE0A8" stroke="#141A33" stroke-width="18"/>
    <g stroke="#141A33" stroke-width="14"><path d="M410 870v110M450 870v110M490 870v110M530 870v110"/></g>
    <g fill="#FF6F4A"><rect x="417" y="882" width="26" height="90"/><rect x="497" y="882" width="26" height="90"/></g>
