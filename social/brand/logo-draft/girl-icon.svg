    <path d="M300 800 C 330 730, 610 730, 640 800 C 610 840, 330 840, 300 800 Z" fill="#FF8A3D" stroke="#141A33" stroke-width="20" stroke-linejoin="round"/>
    <!-- neck -->
    <path d="M425 680 L 425 770 C 440 790, 500 790, 515 770 L 515 680 Z" fill="#F6C9A8" stroke="#141A33" stroke-width="18" stroke-linejoin="round"/>
